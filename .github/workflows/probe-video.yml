name: Probe requested video

on:
  push:
    paths:
      - .github/workflows/probe-video.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install downloader
        run: python -m pip install --user -U "yt-dlp[default]"
      - name: Check public video formats
        run: ~/.local/bin/yt-dlp --no-playlist --verbose -F 'https://youtu.be/1gviYs7eF0c?si=hiW4O5dKcVO8LR4O'
